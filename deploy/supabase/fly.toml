# Fly.io configuration of the Supabase pilot: the all-in-one image as two PROCESS GROUPS
# (audit ARCH-02), region Frankfurt next to the Supabase project:
#   web    - API + SPA + outbox relay / reaper / audit anchors (BOMAGENT_ROLE=web), public
#   worker - ingest, agent and KB consumers (BOMAGENT_ROLE=worker), NO public port
# so deploying the web group does not interrupt a running agent run and a parse that runs out
# of memory restarts only the worker. Deploy from the repository root:
#   fly deploy . --config deploy/supabase/fly.toml \
#     --dockerfile deploy/docker/allinone.Dockerfile --ha=false
# --ha=false keeps one machine per group (cost); for zero-downtime web deploys run
#   fly scale count web=2 worker=1 -a mgr-ibm-bomagent
# FIRST DEPLOY AFTER THIS CHANGE: an old single machine (role "all") and the new groups both
# consume the queue for a moment; that is safe (rows are taken with SKIP LOCKED). Afterwards
# `fly status` must show one web and one worker machine and no machine without a group.
# Secrets are set with `fly secrets set` (deploy/supabase/README.md), never in this file.
app = "mgr-ibm-bomagent"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "60s" # workers finish the current message (30 s grace) before exit

[build]
  dockerfile = "../docker/allinone.Dockerfile"

[processes]
  web = "env BOMAGENT_ROLE=web python -m bomagent_allinone serve"
  # fewer connections: the worker needs 3 consumers and platform-role polling, not request
  # concurrency (each process opens its own pools: mind the Supavisor session limit)
  worker = "env BOMAGENT_ROLE=worker BOMAGENT_DB_POOL_SIZE=3 python -m bomagent_allinone serve"

[deploy]
  # Alembic upgrade as the migrator role, in a temporary machine before the new release
  release_command = "python -m bomagent_allinone migrate"
  strategy = "rolling" # with one machine per group Fly replaces it; two web machines = no gap

[env]
  BOMAGENT_ENVIRONMENT = "dev"
  BOMAGENT_PORT = "8000"
  BOMAGENT_QUEUE_BACKEND = "postgres"
  BOMAGENT_DATABASE_NAME = "bomagent" # our own database, never Supabase's "postgres"
  BOMAGENT_DATABASE_PORT = "5432"     # Supavisor session mode (IPv4)
  BOMAGENT_AWS_REGION = "eu-central-1"
  BOMAGENT_S3_REGION = "eu-west-1" # the Supabase project's region (Ireland)
  BOMAGENT_S3_FORCE_PATH_STYLE = "true"
  BOMAGENT_FILES_BUCKET = "bomagent-files"
  # uvicorn trusts X-Forwarded-* only from Fly's proxy, the only route to the port; the
  # leftmost X-Forwarded-For is client-controlled - use Fly-Client-IP for any IP-based rule
  FORWARDED_ALLOW_IPS = "*"
  # project-specific, not secret (the publishable key is public by design)
  BOMAGENT_SUPABASE_URL = "https://wdjhfugsduoymelipimq.supabase.co"
  BOMAGENT_SUPABASE_ANON_KEY = "sb_publishable__cbNLHQOkii26ujSI5YHGg_ivkSiG70"
  # sample projects ([Sample] ...) added to every new organisation; owners can re-add them
  BOMAGENT_SEED_SAMPLES = "true"
  # social sign-in buttons: enable only after the providers are set up in Supabase
  # (docs/platform/runbooks/social-login.md)
  BOMAGENT_SOCIAL_PROVIDERS = "google,azure"
  BOMAGENT_S3_ENDPOINT_URL = "https://wdjhfugsduoymelipimq.storage.supabase.co/storage/v1/s3"
  BOMAGENT_DATABASE_HOST = "aws-0-eu-west-1.pooler.supabase.com"
  BOMAGENT_DATABASE_USER = "bomagent_app.wdjhfugsduoymelipimq"
  BOMAGENT_PLATFORM_DATABASE_USER = "bomagent_platform.wdjhfugsduoymelipimq"

[http_service]
  internal_port = 8000
  force_https = true
  processes = ["web"] # the worker group has no public port: nothing outside can reach it
  # the outbox relay, the stuck-run reaper and the audit anchor export run in the web group:
  # never stop it when HTTP traffic is idle
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/readyz" # database reachable (web has no consumers)

# The worker group's own health check: /readyz also needs all three queue consumers alive. The
# web /readyz cannot see a missing worker group, so also watch the worker check in `fly status`.
[checks.worker_ready]
  type = "http"
  port = 8000
  method = "GET"
  path = "/readyz"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
  processes = ["worker"]

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "2gb" # three consumers + one sandboxed parse child (RLIMIT_AS 1 GiB)
