# DAST: OWASP ZAP baseline (passive scan) against the local compose stack (QA-05, TESTING.md).
# Manual or scheduled only. It is NOT a pull-request check and must never be a required one.
# Everything stays on the runner: the stack runs on localhost with the fake LLM provider (no
# keys, no real model), ZAP runs with --network host against 127.0.0.1 and its add-on update
# check is switched off, so nothing is sent to a third party. The scan is unauthenticated and
# passive (baseline); authenticated and active scans are a later step.
name: dast-zap

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-zap
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: ZAP baseline vs local compose stack (fake LLM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --all-packages --frozen
      - run: just up-core
      - run: just smoke
      - name: ZAP baseline (passive, report only)
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          # -I: findings never fail the job (report only); -J/-r: JSON and HTML reports.
          # start.checkForUpdates=false: no add-on update traffic leaves the runner.
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8000 -J zap-report.json -r zap-report.html -I \
            -z "-config start.checkForUpdates=false"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: zap-report, path: zap-out, if-no-files-found: ignore }
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: compose-logs, path: compose-logs.txt }
      - if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
