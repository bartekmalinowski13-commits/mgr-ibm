# PR pipeline (ARCHITECTURE.md §13, TESTING.md). All actions pinned to commit SHAs.
name: pr

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.12"
  FORCE_COLOR: "1"

jobs:
  static:
    name: lint, types, module boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: just lint

  python-tests:
    name: unit + integration (Testcontainers) + coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --all-packages --frozen
      - name: pytest (fake LLM provider only - no real keys in CI)
        run: >
          uv run pytest -m "not smoke and not e2e and not isolation"
          --cov --cov-report=xml --cov-report=term-missing:skip-covered
      - name: coverage thresholds (TESTING.md)
        run: uv run python tools/check_coverage.py coverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage-python, path: coverage.xml }

  isolation:
    # Required status check in branch protection: blocks merge on any cross-tenant leak.
    name: tenant isolation (blocking)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -m isolation -v

  contract:
    name: API contract (OpenAPI drift + Schemathesis)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - run: uv sync --all-packages --frozen
      - name: contract tests (skipped until the API contract exists - M4)
        run: |
          if [ -f services/api/openapi.json ]; then uv run pytest -m contract -v
          else echo "no OpenAPI contract yet"; fi

  typescript:
    name: web + ui + infra (biome, tsc, vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run check-generated
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build

  stack-smoke:
    name: compose stack + smoke + E2E (fake LLM)
    runs-on: ubuntu-24.04
    needs: [static, python-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { enable-cache: true }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: uv sync --all-packages --frozen
      - run: just up-core
      - run: just smoke
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - name: e2e (Playwright, critical set)
        if: hashFiles('apps/web/playwright.config.ts') != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @bomagent/web exec playwright install --with-deps chromium
          just e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: "apps/web/playwright-report\napps/web/test-results", if-no-files-found: ignore }
      - if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: compose-logs, path: compose-logs.txt }

  allinone:
    name: all-in-one image (Supabase pilot) - build, bootstrap, migrate, serve
    runs-on: ubuntu-24.04
    needs: [static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: build the image
        run: docker build -f deploy/docker/allinone.Dockerfile -t bomagent-allinone .
      - name: PostgreSQL + pgvector (stands in for the Supabase database)
        run: |
          docker network create pilot
          docker run -d --name pg --network pilot -e POSTGRES_PASSWORD=admin \
            pgvector/pgvector:0.8.7-pg16-trixie
          for _ in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
      - name: bootstrap, migrate, serve, check
        run: |
          db() { echo "postgresql+psycopg://$1:$2@pg:5432/$3"; }
          run() { docker run --rm --network pilot "$@"; }
          run -e BOMAGENT_ADMIN_DATABASE_URL="$(db postgres admin postgres)" \
            -e BOMAGENT_DATABASE_NAME=bomagent -e BOMAGENT_MIGRATOR_PASSWORD=ci-migrator \
            -e BOMAGENT_APP_PASSWORD=ci-app -e BOMAGENT_PLATFORM_PASSWORD=ci-platform \
            bomagent-allinone python -m bomagent_allinone bootstrap
          run -e BOMAGENT_MIGRATOR_DATABASE_URL="$(db bomagent_migrator ci-migrator bomagent)" \
            bomagent-allinone python -m bomagent_allinone migrate
          docker run -d --name app --network pilot -p 8000:8000 \
            -e BOMAGENT_ENVIRONMENT=dev \
            -e BOMAGENT_DATABASE_URL="$(db bomagent_app ci-app bomagent)" \
            -e BOMAGENT_PLATFORM_DATABASE_URL="$(db bomagent_platform ci-platform bomagent)" \
            -e BOMAGENT_SUPABASE_URL=https://example.supabase.co \
            -e BOMAGENT_SUPABASE_ANON_KEY=ci-anon \
            -e BOMAGENT_S3_ENDPOINT_URL=https://example.supabase.co/storage/v1/s3 \
            -e BOMAGENT_FILES_BUCKET=ci -e AWS_ACCESS_KEY_ID=ci -e AWS_SECRET_ACCESS_KEY=ci \
            bomagent-allinone
          for _ in $(seq 1 30); do curl -fsS localhost:8000/readyz && break; sleep 2; done
          curl -fsS localhost:8000/readyz
          curl -fsS localhost:8000/ | grep -qi "<!doctype html"
          curl -fsS localhost:8000/config.json | grep -q '"mode":"supabase"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/v1/me)" = 401
      - if: failure()
        run: docker logs app || true

  security:
    name: secrets + vulnerabilities
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  cdk:
    name: cdk synth + cdk-nag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: cdk tests + synth (skipped until infra/cdk exists - M6)
        run: |
          if [ -f infra/cdk/package.json ]; then
            pnpm --filter @bomagent/infra run test && pnpm --filter @bomagent/infra run synth
          else echo "no CDK app yet"; fi
