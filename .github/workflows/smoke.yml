# Post-deploy smoke (OPS-04). Manual only: runs tests/smoke against a deployed URL.
# Needs the GitHub environment "smoke" with this secret (name only; the value is set by the
# repository owner, belongs to a dedicated smoke tenant, never a customer tenant):
#   SMOKE_TENANT_API_KEY - API key of the smoke tenant
# The job is manual: without the secret it FAILS (a green run must mean the deployment works).
# Scope today: the API /healthz, /readyz (status ok and every readiness check true) and an
# authenticated tenant read with the smoke key (auth, tenant context, RLS). The compose-only
# checks (worker, indexer, gateway, ingest) are not run against a remote pilot.
name: smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL of the deployed API, e.g. https://<app>.fly.dev"
        required: true

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: smoke
    env:
      SMOKE_TENANT_API_KEY: ${{ secrets.SMOKE_TENANT_API_KEY }}
      SMOKE_URL: ${{ inputs.url }}
    steps:
      - name: Check secrets
        id: gate
        run: |
          if [ -z "$SMOKE_TENANT_API_KEY" ]; then
            echo "::error::SMOKE_TENANT_API_KEY is not set in environment 'smoke': the deployment was NOT checked."
            exit 1
          else
            case "$SMOKE_URL" in
              https://*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "url must start with https://"; exit 1 ;;
            esac
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.run == 'true'
      - name: Smoke tests (API health, readiness, authenticated tenant read)
        if: steps.gate.outputs.run == 'true'
        env:
          SMOKE_API_URL: ${{ inputs.url }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_TENANT_API_KEY }}
        run: uv run --frozen pytest -m smoke tests/smoke -k "(test_service_health_and_readiness and api) or test_api_serves_tenant_data" -v
