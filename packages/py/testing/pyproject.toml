[project]
name = "bomagent-testing"
version = "0.1.0"
description = "Shared pytest fixtures: PostgreSQL+pgvector (Testcontainers or external), migrated test DB, tenants"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "pytest>=8.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "bomagent-db-migrations",
    "bomagent-platform-common",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_testing"]

[tool.uv.sources]
bomagent-db-migrations = { workspace = true }
bomagent-platform-common = { workspace = true }
