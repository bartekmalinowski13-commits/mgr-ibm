[project]
name = "bomagent-llm"
version = "0.1.0"
description = "LLM gateway client, model catalog (closed/open-weight, EU residency), structured output, fake provider"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.28",
    "bomagent-platform-common",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_llm"]

[tool.uv.sources]
bomagent-platform-common = { workspace = true }
