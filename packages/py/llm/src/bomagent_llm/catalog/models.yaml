# Model catalogue (ADR-0006). Every call goes through the LLM gateway (LiteLLM); the
# gateway model name below is what the platform sends to it.
#
# !!! Model IDs and their availability per AWS/Azure region change frequently. Every
# !!! non-local entry is `enabled: false` and `verified: false` until a human checks the
# !!! exact ID in the provider console for the target EU region (eu-central-1 for
# !!! Bedrock, Sweden Central / EU Data Zone for Azure) and flips both flags.
#
# license_class: closed | open-weight      residency: eu-region | eu-geo | local
# Costs are EUR per 1M tokens and are placeholders until checked against the price list.
models:
  # ---------------------------------------------------------------- local / CI only
  - id: fake-closed
    gateway_model: fake-closed
    provider: fake
    license_class: closed
    residency: local
    capabilities: [chat, structured_output, tools]
    tier: strong
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: true
    verified: true
  - id: fake-open-weight
    gateway_model: fake-open-weight
    provider: fake
    license_class: open-weight
    residency: local
    capabilities: [chat, structured_output, tools]
    tier: strong
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: true
    verified: true
  - id: fake-embedding
    gateway_model: fake-embedding
    provider: fake
    license_class: open-weight
    residency: local
    capabilities: [embedding]
    dimensions: 1024
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: true
    verified: true
  - id: ollama-llama
    gateway_model: ollama-llama
    provider: ollama
    license_class: open-weight
    residency: local
    capabilities: [chat]
    tier: fast
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: developer machines only (compose profile "ollama")

  # Local open-weight models run by the owner with Ollama (Apple silicon) for learning and
  # experiments (`bomagent run`, `bomagent experiment run`, `just demo`) - NOT for the Fly pilot
  # (a Fly machine cannot reach a laptop without a tunnel, and local models never go through the
  # EU gateway). gateway_model is the Ollama tag; point BOMAGENT_LLM_GATEWAY_URL at
  # http://localhost:11434 (Ollama's OpenAI-compatible API). Enable one locally with the override
  # file (BOMAGENT_CATALOG_OVERRIDE), see docs/platform/runbooks/local-models.md. Download sizes are
  # from the Ollama library pages (2026-11-12); "RAM" adds roughly 2-4 GB for the KV cache.
  - id: ollama-qwen3-8b
    gateway_model: qwen3:8b
    provider: ollama
    license_class: open-weight
    residency: local
    capabilities: [chat, structured_output, tools]
    tier: fast
    enabled: false
    verified: false
    notes: ollama pull qwen3:8b (5.2 GB download, about 8 GB RAM); Apache-2.0 weights; a thinking model - slower per answer
  - id: ollama-qwen3-14b
    gateway_model: qwen3:14b
    provider: ollama
    license_class: open-weight
    residency: local
    capabilities: [chat, structured_output, tools]
    tier: balanced
    enabled: false
    verified: false
    notes: ollama pull qwen3:14b (9.3 GB download, about 12 GB RAM); Apache-2.0 weights
  - id: ollama-llama3-1-8b
    gateway_model: llama3.1:8b
    provider: ollama
    license_class: open-weight
    residency: local
    capabilities: [chat, tools]
    tier: fast
    enabled: false
    verified: false
    notes: ollama pull llama3.1:8b (4.9 GB download, about 8 GB RAM); Llama 3.1 community licence (not OSI open source)
  - id: ollama-mistral-small
    gateway_model: mistral-small:24b
    provider: ollama
    license_class: open-weight
    residency: local
    capabilities: [chat, structured_output, tools]
    tier: balanced
    enabled: false
    verified: false
    notes: ollama pull mistral-small:24b (14 GB download, about 18 GB RAM, 32K context tag); Apache-2.0
  - id: ollama-ministral-3-8b
    gateway_model: ministral-3:8b
    provider: ollama
    license_class: open-weight
    residency: local
    capabilities: [chat, structured_output, tools]
    tier: fast
    enabled: false
    verified: false
    notes: ollama pull ministral-3:8b (6.0 GB download, about 9 GB RAM); Apache-2.0; ministral-3:3b (3.0 GB) and :14b (9.1 GB) also exist
  - id: ollama-gpt-oss-20b
    gateway_model: gpt-oss:20b
    provider: ollama
    license_class: open-weight
    residency: local
    capabilities: [chat, tools]
    tier: balanced
    enabled: false
    verified: false
    notes: ollama pull gpt-oss:20b (14 GB download, about 16 GB RAM, 128K context); Apache-2.0; needs a 32 GB Mac for comfortable use

  # ---------------------------------------------------------------- closed, Anthropic via Amazon Bedrock (EU)
  # Use an EU inference profile (prefix "eu.") or in-region model. Check the profile's
  # destination regions: some EU profiles may include non-EU-member regions (e.g.
  # Zurich). For strict "EU only" use an application inference profile limited to EU
  # member-state regions (ARCHITECTURE.md §8).
  - id: claude-opus-eu
    gateway_model: bedrock/eu.anthropic.claude-opus-5-5
    provider: bedrock
    license_class: closed
    residency: eu-geo
    region: eu-central-1
    capabilities: [chat, structured_output, tools, prompt_caching]
    tier: strong
    cost_in_eur: 3.7
    cost_out_eur: 18.5
    enabled: false
    verified: false
    notes: id and EU profile checked against https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-opus-5-5.html (2026-11-12); the eu. profile routes only to EU member-state regions (eu-central-1, eu-north-1, eu-south-1, eu-south-2, eu-west-1, eu-west-3 from a Frankfurt source) - re-verify with GetInferenceProfile from eu-central-1 and enable model access in the account
  - id: claude-sonnet-eu
    gateway_model: bedrock/eu.anthropic.claude-sonnet-5-5
    provider: bedrock
    license_class: closed
    residency: eu-geo
    region: eu-central-1
    capabilities: [chat, structured_output, tools, prompt_caching]
    tier: balanced
    cost_in_eur: 1.85
    cost_out_eur: 9.25
    enabled: false
    verified: false
    notes: id and EU profile checked against https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-sonnet-5-5.html (2026-11-12); the eu. profile routes only to EU member-state regions (eu-central-1, eu-north-1, eu-south-1, eu-south-2, eu-west-1, eu-west-3 from a Frankfurt source) - re-verify with GetInferenceProfile from eu-central-1 and enable model access in the account
  - id: claude-haiku-eu
    gateway_model: bedrock/eu.anthropic.claude-haiku-5-5
    provider: bedrock
    license_class: closed
    residency: eu-geo
    region: eu-central-1
    capabilities: [chat, structured_output, tools]
    tier: fast
    cost_in_eur: 0.1
    cost_out_eur: 0.5
    enabled: false
    verified: false
    notes: id and EU profile checked against https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-anthropic-claude-haiku-5-5.html (2026-11-12); the eu. profile routes only to EU member-state regions (eu-central-1, eu-north-1, eu-south-1, eu-south-2, eu-west-1, eu-west-3 from a Frankfurt source) - re-verify with GetInferenceProfile from eu-central-1 and enable model access in the account

  # ---------------------------------------------------------------- closed, OpenAI via Azure OpenAI (EU Data Zone Standard)
  # Deployment name is chosen when the Azure deployment is created; never use "Global"
  # deployment types.
  - id: openai-eu
    gateway_model: azure/bomagent-gpt-eu-datazone
    provider: azure_openai
    license_class: closed
    residency: eu-geo
    region: swedencentral
    capabilities: [chat, structured_output, tools]
    tier: strong
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: set the deployment (model + version) in Azure, Data Zone Standard EU

  # ---------------------------------------------------------------- open-weight
  - id: mistral-large-eu
    gateway_model: mistral/mistral-large-latest
    provider: mistral
    license_class: open-weight
    residency: eu-region
    capabilities: [chat, structured_output, tools]
    tier: strong
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: >-
      Mistral AI La Plateforme via the regional endpoint https://api.eu.mistral.ai (the default api.mistral.ai does NOT guarantee EU inference; EU regional inference carries a surcharge, see docs.mistral.ai/inference/regional-inference). The -latest alias is kept on purpose; as of
      2026-11-12 https://docs.mistral.ai/getting-started/models/models_overview/ lists Mistral Large 3
      (mistral-large-2512, deprecated 2026-10-31) and Mistral Large 4 (mistral-large-4-0, id not confirmed
      from the API reference). Pin an exact id after checking GET /v1/models with the owner key, and
      confirm the EU-only data processing setting of the workspace.
  - id: open-weight-bedrock-eu
    gateway_model: bedrock/eu.meta.llama-open-weight-model-id
    provider: bedrock
    license_class: open-weight
    residency: eu-geo
    region: eu-central-1
    capabilities: [chat, structured_output]
    tier: balanced
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: >-
      placeholder. Checked 2026-11-12: Llama 3.3 70B on Bedrock has only a us. geo profile and
      US in-region availability (no EU), so it cannot be confirmed for the EU; prefer
      gpt-oss-120b-bedrock-eu or qwen3-235b-bedrock-eu, or put another model's exact EU id here
  # Qwen (Alibaba). The Alibaba Cloud / DashScope API is deliberately NOT in this catalogue: it
  # does not guarantee EU processing. Mistral La Plateforme does not host Qwen. Verified EU-resident
  # ways (researched 2026-11-12): Amazon Bedrock in-region in eu-central-1 / eu-north-1 / eu-south-1
  # (not eu-west-1, not via geo profiles) and self-hosting (vLLM) in an EU region. Azure AI Foundry
  # EU availability of Qwen was not verifiable from the docs - add an entry only after checking it.
  - id: qwen3-235b-bedrock-eu
    gateway_model: bedrock/qwen.qwen3-235b-a22b-2507-v1:0
    provider: bedrock
    license_class: open-weight
    residency: eu-region
    region: eu-central-1
    capabilities: [chat, structured_output, tools]
    tier: strong
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: >-
      Qwen3 235B A22B 2507 (Apache-2.0 weights) served in-region by Bedrock in eu-central-1, see
      https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-qwen-qwen3-235b-a22b-2507.html
      (bedrock-runtime In-Region: eu-central-1, eu-north-1, eu-south-1; no geo/global profile, so
      nothing leaves the region). Check the LiteLLM Bedrock route for qwen.* ids and model access in
      the account before enabling; costs are unset (check the Bedrock price list).
  - id: gpt-oss-120b-bedrock-eu
    gateway_model: bedrock/openai.gpt-oss-120b-1:0
    provider: bedrock
    license_class: open-weight
    residency: eu-region
    region: eu-central-1
    capabilities: [chat, structured_output, tools]
    tier: strong
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: >-
      OpenAI gpt-oss-120b (Apache-2.0 weights), Bedrock in-region, id openai.gpt-oss-120b-1:0 per
      https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-oss-120b.html
      (bedrock-runtime In-Region in eu-central-1, eu-north-1, eu-south-1, eu-west-1; no EU geo
      profile, so nothing leaves the region). Costs unset. gpt-oss-20b on Bedrock was not checked.
  - id: ministral-8b-mistral-eu
    gateway_model: mistral/ministral-8b-latest
    provider: mistral
    license_class: open-weight
    residency: eu-region
    capabilities: [chat, structured_output, tools]
    tier: fast
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: >-
      Ministral open-weight (Apache-2.0 for Ministral 3) served by La Plateforme, EU regional endpoint api.eu.mistral.ai only.
      The -latest alias is a guess: the model overview (https://docs.mistral.ai/getting-started/models/models_overview/)
      lists Ministral 3 3B/8B/14B without API ids - take the exact id from GET /v1/models.
  - id: mistral-small-mistral-eu
    gateway_model: mistral/mistral-small-latest
    provider: mistral
    license_class: open-weight
    residency: eu-region
    capabilities: [chat, structured_output, tools]
    tier: balanced
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: >-
      Mistral Small (Small 4 is Apache-2.0 per the model overview) on La Plateforme; confirm the exact
      id and the EU data-processing setting in the workspace. Codestral is not open-weight and open-mistral-nemo
      is retired, so neither is listed.
  - id: qwen3-vllm-self-hosted
    gateway_model: hosted_vllm/Qwen/Qwen3-32B
    provider: vllm
    license_class: open-weight
    residency: eu-region
    region: eu-central-1
    capabilities: [chat, structured_output, tools]
    tier: balanced
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: >-
      Qwen3 (Apache-2.0) served by vLLM on GPU hardware in an EU region (ADR-0003 feature flag;
      the cloud gateway does not render vllm entries yet - needs a reachable *.internal api_base).
      Pick the model size to fit the GPU; weights are downloaded from the model hub at deploy time,
      never at request time.
  - id: vllm-self-hosted
    gateway_model: hosted_vllm/open-weight-model
    provider: vllm
    license_class: open-weight
    residency: eu-region
    region: eu-central-1
    capabilities: [chat, structured_output]
    tier: balanced
    cost_in_eur: 0.0
    cost_out_eur: 0.0
    enabled: false
    verified: false
    notes: model-serving on EC2 GPU, behind a feature flag (ADR-0003)

