[project]
name = "bomagent-agents"
version = "0.1.0"
description = "Agent definitions, versioned prompts, variant runtimes A (LLM-only) and B (hybrid)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=0.2.60",
    "opentelemetry-api>=1.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bomagent-platform-common",
    "bomagent-bom-core",
    "bomagent-cad-parsers",
    "bomagent-rules",
    "bomagent-kb",
    "bomagent-llm",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_agents"]

[tool.uv.sources]
bomagent-platform-common = { workspace = true }
bomagent-bom-core = { workspace = true }
bomagent-cad-parsers = { workspace = true }
bomagent-rules = { workspace = true }
bomagent-kb = { workspace = true }
bomagent-llm = { workspace = true }
