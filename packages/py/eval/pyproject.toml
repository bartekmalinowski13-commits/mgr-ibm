[project]
name = "bomagent-eval"
version = "0.1.0"
description = "Evaluation metrics: BOM vs reference (P/R/F1, field accuracy, hallucinations, cost)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "pydantic>=2.9",
    "bomagent-bom-core",
    "bomagent-cad-parsers",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_eval"]

[tool.uv.sources]
bomagent-bom-core = { workspace = true }
bomagent-cad-parsers = { workspace = true }
