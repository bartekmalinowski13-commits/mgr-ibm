[project]
name = "bomagent-kb"
version = "0.1.0"
description = "Knowledge base: ingestion, chunking, hybrid retrieval (pgvector + FTS), scopes global/tenant"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
    "pypdf>=5.1",
    "bomagent-bom-core",
    "bomagent-platform-common",
    "bomagent-llm",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_kb"]

[tool.uv.sources]
bomagent-bom-core = { workspace = true }
bomagent-platform-common = { workspace = true }
bomagent-llm = { workspace = true }
