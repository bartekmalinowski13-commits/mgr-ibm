[project]
name = "bomagent-agent-worker"
version = "0.1.0"
description = "Worker executing BOM runs (variants A and B)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bomagent-platform-common",
    "bomagent-agents",
    "bomagent-llm",
    "bomagent-kb",
    "bomagent-cad-parsers",
    "bomagent-bom-core",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_agent_worker"]

[tool.uv.sources]
bomagent-platform-common = { workspace = true }
bomagent-agents = { workspace = true }
bomagent-llm = { workspace = true }
bomagent-kb = { workspace = true }
bomagent-cad-parsers = { workspace = true }
bomagent-bom-core = { workspace = true }
