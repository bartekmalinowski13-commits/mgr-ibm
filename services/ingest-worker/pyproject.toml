[project]
name = "bomagent-ingest-worker"
version = "0.1.0"
description = "Sandboxed worker parsing untrusted design files"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bomagent-platform-common",
    "bomagent-bom-core",
    "bomagent-cad-parsers",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_ingest"]

[tool.uv.sources]
bomagent-platform-common = { workspace = true }
bomagent-bom-core = { workspace = true }
bomagent-cad-parsers = { workspace = true }
