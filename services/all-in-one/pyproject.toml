[project]
name = "bomagent-all-in-one"
version = "0.1.0"
description = "Supabase pilot: API + ingest/agent/KB workers on the PostgreSQL queue + SPA in one process"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bomagent-platform-common",
    "bomagent-db-migrations",
    "bomagent-api",
    "bomagent-ingest-worker",
    "bomagent-agent-worker",
    "bomagent-kb-indexer",
    "bomagent-agents",
    "bomagent-kb",
    "bomagent-llm",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_allinone"]

[tool.uv.sources]
bomagent-platform-common = { workspace = true }
bomagent-db-migrations = { workspace = true }
bomagent-api = { workspace = true }
bomagent-ingest-worker = { workspace = true }
bomagent-agent-worker = { workspace = true }
bomagent-kb-indexer = { workspace = true }
bomagent-agents = { workspace = true }
bomagent-kb = { workspace = true }
bomagent-llm = { workspace = true }
