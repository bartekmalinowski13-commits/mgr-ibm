[project]
name = "bomagent-kb-indexer"
version = "0.1.0"
description = "Worker indexing knowledge-base documents (chunking + embeddings)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bomagent-platform-common",
    "bomagent-kb",
    "bomagent-llm",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_kb_indexer"]

[tool.uv.sources]
bomagent-platform-common = { workspace = true }
bomagent-kb = { workspace = true }
bomagent-llm = { workspace = true }
