[project]
name = "bomagent-api"
version = "0.1.0"
description = "Public REST API (FastAPI): tenancy, identity, projects, runs, BOM, KB admin, audit, metering"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "bomagent-cad-parsers",
    "bomagent-eval",
    "bomagent-platform-common",
    "bomagent-bom-core",
    "bomagent-kb",
    "bomagent-llm",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bomagent_api"]

[tool.uv.sources]
bomagent-platform-common = { workspace = true }
bomagent-bom-core = { workspace = true }
bomagent-kb = { workspace = true }
bomagent-llm = { workspace = true }
bomagent-cad-parsers = { workspace = true }
bomagent-eval = { workspace = true }
